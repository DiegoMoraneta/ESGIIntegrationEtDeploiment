name: Test Workflow Context

on:
    [workflow_dispatch, push]

configuration:
    name: run-name
    description: run-name allows you to define the name of the workflow run that appears on the UI
    value: ${{ 'My custom workflow run name - ' + runner.os }}


jobs:
    echo-data:
        runs-on: ubuntu-latest
        steps:
            - name: Display information
              run: |
                  echo "Event name: ${{ github.event_name }}"
                  echo "Ref: ${{ github.ref }}"
                  echo "SHA: ${{ github.sha }}"
                  echo "Actor: ${{ github.actor }}"
                  echo "Workflow: ${{ github.workflow }}"
                  echo "Run ID: ${{ github.run_id }}"
                  echo "Run number: ${{ github.run_number }}"

            - name: Retrieve Variable
              run: |
                  echo "MY_VAR: ${{ github.event.inputs.MY_VARIABLE }}"

    

