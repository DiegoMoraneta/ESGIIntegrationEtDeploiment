name: Exo 3

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7
      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
      - name: Installer les dépendances
        run: npm ci
      - name: Executer le build
        run: npm run build
      - name: Publier /dist comme artefact
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7
      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Recuperer l'artefact du build
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist
      - name: Installer les dépendances
        run: npm ci
      - name: Executer npm test
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Recuperer l'artefact application
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist
      - name: Afficher la variable API_URL
        run: echo "API_URL=${{ vars.API_URL }}"
      - name: Resumer la cible, l'URL et le commit
        run: |
          echo "Cible: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "URL: ${{ vars.API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY